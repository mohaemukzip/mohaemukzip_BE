spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    show-sql: false
    hibernate:
      ddl-auto: update

  data:
    redis:
      host: redis
      port: 6379

server:
  port: 8080
  forward-headers-strategy: framework

jwt:
  secret: ${JWT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: when-authorized
    prometheus:
      enabled: true
      cache:
        time-to-live: 10s
  server:
    port: 9091

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui

gemini:
  recipe:
    api-key: ${GEMINI_API_KEY}  #레시피 챗봇
  summary:
    api-key: ${GEMINI_RECIPE_KEY}  #요약 생성용

youtube:
  api:
    key: ${YOUTUBE_API_KEY}

transcript:
  proxy-url: ${TRANSCRIPT_PROXY_URL:}

kakao:
  api:
    rest-api-key: ${KAKAO_REST_API_KEY}

apple:
  client-id: temp
  team-id: temp
  key-id: temp
  private-key: temp

# 회원 가입/탈퇴, 서버 에러(5xx) Discord 알림 - prod(EC2/RDS)에서만 전송. 다른 프로필은 미설정이라 전송하지 않음
discord:
  member-webhook:
    url: ${DISCORD_MEMBER_WEBHOOK_URL:}
  error-webhook:
    url: ${DISCORD_ERROR_WEBHOOK_URL:}
